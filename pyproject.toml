[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boilermind-trusted"
version = "0.1.0"
description = "Trusted scientific core for BoilerMind AI Scientist"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "dashscope>=1.20,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7,<3",
    "openai>=1.0,<4",
    "pandas>=2.2,<4",
    "PyYAML>=6,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9,<1",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "statsmodels>=0.14,<1",
    "torch>=2.5,<3",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
    "websocket-client>=1.8,<2"
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
